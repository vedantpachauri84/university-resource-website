{% extends "base_or_navbar/navebar.html" %}

{% block title %}AI Analysis | AKTU Student Help{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <p class="page-label mb-2">AI study help</p>
            <h1 class="page-heading h2 mb-4">Paper analysis</h1>
            <article class="card overflow-hidden">
                <div class="p-4 text-white" style="background:linear-gradient(135deg,#4338ca,#6d28d9);">
                    <p class="mb-1 text-white-50 small text-uppercase fw-bold">Exam preparation</p>
                    <h2 class="h4 mb-0">{{ paper.title }}</h2>
                </div>
                <div class="p-4 p-md-5">
                    <div class="d-flex align-items-center gap-2 mb-4 text-primary">
                        <span class="fs-4">✦</span>
                        <strong>Insights generated for your revision</strong>
                    </div>
                    <div class="text-secondary" style="white-space:pre-wrap;line-height:1.8;">{{ result }}</div>
                </div>
            </article>
        </div>
    </div>
</div>
{% endblock %}
